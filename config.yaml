scan_interval_seconds: 10
dry_run: true

arbitrage:
  min_edge_pct: 3.0
  min_exit_edge_pct: 0.5
  max_hold_hours: 48

risk:
  max_position_usd: 100
  max_concurrent_positions: 10
  max_daily_loss_usd: 500
  bankroll_fraction: 0.05

fees:
  maker_pct: 0.0
  taker_pct: 0.0   # Most prediction markets have 0% fees (crypto 15min markets up to 3%)

filters:
  min_volume_usd: 50000
  min_liquidity_usd: 10000

execution:
  maker_timeout_ms: 15000     # Wait 15s for maker fill, then switch to taker
  maker_spread_offset: 0.005  # Place maker 0.5¢ below best ask
  max_slippage: 0.02          # Max 2% slippage on taker fallback
